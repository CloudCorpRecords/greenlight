name: Greenlight Guard
description: >-
  Post a maintainer-side guard report on a pull request: competing fix, prior
  claims by someone other than the PR author, missing required artifacts
  (changeset file, DCO sign-off, CLA status), and first-time contributor
  signal. Greenlight itself never posts; this action posts one comment and
  updates it on later pushes instead of spamming.
inputs:
  pr-url:
    description: >-
      Full GitHub PR URL to guard. Defaults to the pull request that
      triggered the workflow.
    required: false
    default: ""
  config-file:
    description: >-
      Repo-relative path to a .greenlight-guard.json file with per-check
      toggles (competing-fix, other-claim, missing-artifact, first-time).
      Defaults to the repo root.
    required: false
    default: ".greenlight-guard.json"
outputs:
  findings:
    description: Number of flagged findings (severity flag) in the report.
    value: ${{ steps.guard.outputs.findings }}
  autopilot:
    description: JSON array of label names the guard's autopilot decided to apply (empty unless the repo enabled autopilot in .greenlight-guard.json).
    value: ${{ steps.guard.outputs.autopilot }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "20"
    - name: Run greenlight guard
      id: guard
      shell: bash
      run: |
        URL="${{ inputs.pr-url }}"
        if [ -z "$URL" ]; then
          URL="${{ github.event.pull_request.html_url }}"
        fi
        # guard exits 3 when findings exist; that is expected, not an error.
        npx -y @reneturcios/greenlight@latest guard "$URL" --json > greenlight-guard.json || code=$?
        if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 3 ]; then
          echo "::error::greenlight guard failed with exit $code"
          exit "$code"
        fi
        COUNT=$(node -e "const r = require('./greenlight-guard.json'); console.log(r.findings.filter(f => f.severity === 'flag').length)")
        echo "findings=$COUNT" >> "$GITHUB_OUTPUT"
        # Autopilot label decisions, computed by the guard from the repo's
        # .greenlight-guard.json. Empty unless the maintainer enabled
        # autopilot, so the label step below only runs when configured.
        AUTOPILOT=$(node -e "const r = require('./greenlight-guard.json'); console.log(JSON.stringify(r.autopilotLabels || []))")
        echo "autopilot=$AUTOPILOT" >> "$GITHUB_OUTPUT"
    - name: Apply autopilot labels
      # Gated: runs only when the guard decided labels, which happens only
      # when the repo's .greenlight-guard.json enabled autopilot. Labels
      # that do not exist are created; any failure degrades to a warning
      # and never fails the run.
      if: steps.guard.outputs.autopilot != '[]'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const labels = JSON.parse(`${{ steps.guard.outputs.autopilot }}`);
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          for (const name of labels) {
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
              core.info(`Applied autopilot label "${name}"`);
            } catch (addErr) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color: "ededed", description: "Applied by the Greenlight guard autopilot" });
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
                core.info(`Created and applied autopilot label "${name}"`);
              } catch (createErr) {
                core.warning(`Autopilot could not apply label "${name}": ${createErr.message}`);
              }
            }
          }
    - name: Post or update the guard comment
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("greenlight-guard.json", "utf8"));
          const marker = "<!-- greenlight-guard -->";
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          const body = report.markdown;
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            core.info(`Updated guard comment ${existing.id}`);
          } else {
            const { data: created } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`Created guard comment ${created.id}`);
          }
